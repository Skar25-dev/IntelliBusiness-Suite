# Uso:
#   cp .env.example .env     # y rellena POSTGRES_PASSWORD (y los datos SMTP si quieres emails)
#   docker compose up --build
#   # Primera vez: datos de demo + entrenar el modelo de IA (seed BORRA los datos existentes)
#   docker compose exec app python seed_suite.py
#   docker compose exec app python -m app.ai.trainer
#
# La app queda en http://localhost:8000

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-suite_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_TYPE: postgresql
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./reports:/app/reports
      - ./config:/app/config
      - modelstore:/app/app/ai/model_store

volumes:
  pgdata:
  modelstore:
